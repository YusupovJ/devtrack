services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=postgres
      - POSTGRES_DB=devtrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - 5432

volumes:
  postgres_data:
